<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Produto | Lolly Closet</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

<header>
  <div class="logo">
    <a href="index.html">
      <h1>Lolly Closet</h1>
    </a>
  </div>

  <!-- MENU DE NAVEGAÇÃO -->
  <nav id="menu-principal" aria-label="Navegação principal">

    <div class="titulo-menu-mobile">
      <h2>Menu</h2>

      <button
        type="button"
        id="fechar-menu-mobile"
        aria-label="Fechar menu"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M5 5L19 19M19 5L5 19"></path>
        </svg>
      </button>
    </div>

    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="produtos.html">Produtos</a></li>
      <li><a href="index.html#sobre">Sobre</a></li>
    </ul>

    <!-- AÇÕES DO MENU LATERAL -->
    <div class="acoes-menu-mobile">
      <a href="#" class="conta-menu">
        Minha conta
      </a>

      <a
        href="#"
        id="abrir-carrinho-mobile"
        class="carrinho-menu"
      >
        Carrinho (<span id="contador-carrinho-mobile">0</span>)
      </a>
    </div>
  </nav>

  <!-- AÇÕES DO CABEÇALHO -->
  <div class="acoes">

    <a
      href="#"
      class="minha-conta"
      aria-label="Minha conta"
      title="Minha conta"
    >
      <span class="texto-conta">Minha conta</span>

      <svg
        class="icone-conta"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
      </svg>
    </a>

    <a
      href="#"
      class="carrinho"
      id="abrir-carrinho"
      aria-label="Abrir carrinho"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="19" cy="20" r="1"></circle>
        <path d="M3 4h2l2.5 11h10.5l2-7H7"></path>
      </svg>

      <span id="contador-carrinho">0</span>
    </a>

    <!-- BOTÃO HAMBÚRGUER -->
    <button
      type="button"
      class="menu-mobile-botao"
      id="alternar-menu-mobile"
      aria-label="Abrir menu de navegação"
      aria-controls="menu-principal"
      aria-expanded="false"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

  </div>
</header>


    <div class="fundo-carrinho" id="fundo-carrinho"></div>

    <aside class="painel-carrinho" id="painel-carrinho">
      <div class="cabecalho-carrinho">
        <h2>Seu carrinho</h2>

        <button type="button" id="fechar-carrinho">✕</button>
      </div>

      <div class="conteudo-carrinho" id="conteudo-carrinho">
        <p class="carrinho-vazio">Seu carrinho está vazio.</p>
      </div>

      <div class="resumo-carrinho" id="resumo-carrinho">
        <div class="linha-subtotal">
          <span>Subtotal</span>

          <strong id="subtotal-carrinho"> R$ 0,00 </strong>
        </div>

        <!-- CALCULAR FRETE -->

        <div class="calculo-frete">
          <label for="cep-frete"> Calcule o frete </label>

          <div class="campo-frete">
            <input
              type="text"
              id="cep-frete"
              placeholder="00000-000"
              maxlength="9"
            />

            <button type="button" id="calcular-frete">Calcular</button>
          </div>

          <div class="resultado-frete" id="resultado-frete"></div>
        </div>

        <a href="carrinho.html" class="btn-ver-carrinho">Ver carrinho</a>
      </div>
    </aside>

    <main class="pagina-produto">
      <div class="produto-detalhes">
        <!-- FOTOS DO PRODUTO -->
        <div class="produto-fotos">
          <div class="foto-principal">
            <button
              type="button"
              class="seta-galeria seta-anterior"
              id="foto-anterior"
              aria-label="Foto anterior"
            >
              ‹
            </button>

            <img
                alt="Imagem do produto"
                id="produto-imagem"
                style="visibility: hidden"
            />

            <button
              type="button"
              class="seta-galeria seta-proxima"
              id="foto-proxima"
              aria-label="Próxima foto"
            >
              ›
            </button>
          </div>

          <!-- MINIATURAS DAS FOTOS -->
          <div class="galeria-miniaturas" id="galeria-miniaturas"></div>
        </div>

        <!-- INFORMAÇÕES -->

        <div class="produto-compra">
          <p class="produto-categoria">LOLLY CLOSET</p>

<h1 id="produto-nome">Carregando produto...</h1>

<p class="produto-preco" id="produto-preco"></p>

<p class="produto-descricao" id="produto-descricao"></p>

          <!-- TAMANHO -->

          <div class="escolha-tamanho" id="produto-tamanhos">
            <p>Tamanho</p>
          <div class="tamanhos" id="lista-tamanhos-produto"></div>
          </div>

          <!-- COR -->

          <div class="escolha-cor" id="produto-cores">
            <p>Cor</p>

            <div class="cores">
            </div>
          </div>

          <!-- QUANTIDADE -->

          <div class="quantidade">
            <label for="quantidade"> Quantidade </label>

            <input type="number" id="quantidade" min="1" value="1" />
          </div>

          <p id="produto-mensagem"></p>

          <!-- ADICIONAR -->

          <button type="button" class="btn-adicionar">
            Adicionar ao carrinho
          </button>

          <!-- INFORMAÇÕES -->

          <div class="informacoes-produto">
            <p>✓ Produto selecionado com cuidado</p>

            <p>✓ Envio para todo o Brasil</p>

            <p>✓ Compra segura</p>
          </div>
        </div>
      </div>
    </main>

<script src="script.js"></script>
<script src="./menu-mobile.js"></script>
<script type="module" src="./produto-detalhes-firebase.js"></script>
</body>
  </body>
</html>
